<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #b5794a; } a:hover { color: #cf9464; }
  </style>
</helmet>
<div style="position: relative; width: 1200px; height: 1500px; overflow: hidden; background-color: #201e1a; font-family: Georgia, 'Times New Roman', serif; display: flex; flex-direction: column;">

  <div style="margin: 72px auto 0 auto; border: 1px solid #4a4438; padding: 6px; width: 714px;">
    <img src="./thinker-card-img.jpg" alt="The Thinker, Auguste Rodin, National Gallery of Art" style="display: block; width: 714px; height: 900px;">
  </div>

  <div style="margin: 40px 88px 0 88px; display: flex; flex-direction: column; gap: 22px;">
    <div style="font-family: 'Spectral', Georgia, serif; font-style: italic; font-weight: 400; font-size: 37px; line-height: 1.36; color: #eee6d6; text-wrap: pretty;">
      Art is contemplation. It is the pleasure of the mind which searches into nature and which there divines the spirit by which Nature herself is animated.
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="width: 56px; height: 1px; background: #b5794a;"></div>
      <div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 500; font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase; color: #b5794a;">
        Auguste Rodin
      </div>
      <div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 500; font-size: 14px; letter-spacing: 0.08em; color: #9a9182;">
        Art: Conversations with Paul Gsell, 1912
      </div>
    </div>
  </div>

  <div style="margin-top: auto; padding: 0 88px 52px 88px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: #77705f;">
    Humanity Moment of the Day
  </div>
</div>
</x-dc>
</body>
</html>
