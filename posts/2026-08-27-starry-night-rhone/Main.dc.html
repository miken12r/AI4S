<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #e3b158; } a:hover { color: #f0c878; }
  </style>
</helmet>
<div style="position: relative; width: 1200px; height: 1500px; overflow: hidden; background-color: #11172c; font-family: Georgia, 'Times New Roman', serif; display: flex; flex-direction: column;">

  <div style="margin: 64px 64px 0 64px; border: 1px solid #3a4468; padding: 6px;">
    <img src="./starry-card-img.jpg" alt="Starry Night Over the Rhône, Vincent van Gogh, 1888" style="display: block; width: 100%; height: auto;">
  </div>

  <div style="margin: 44px 88px 0 88px; display: flex; flex-direction: column; gap: 24px;">
    <div style="font-family: 'Spectral', Georgia, serif; font-style: italic; font-weight: 400; font-size: 40px; line-height: 1.36; color: #f2ead6; text-wrap: pretty;">
      That doesn&#39;t stop me having a tremendous need for, shall I say the word &mdash; for religion &mdash; so I go outside at night to paint the stars&hellip;
    </div>
    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="width: 56px; height: 1px; background: #e3b158;"></div>
      <div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 500; font-size: 19px; letter-spacing: 0.14em; text-transform: uppercase; color: #e3b158;">
        Vincent van Gogh
      </div>
      <div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.08em; color: #8fa0c4;">
        Letter to Theo van Gogh, Arles, 29 September 1888
      </div>
    </div>
  </div>

  <div style="margin-top: auto; padding: 0 88px 56px 88px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: #6c7ba0;">
    Humanity Moment of the Day
  </div>
</div>
</x-dc>
</body>
</html>
